version: '3.8'

services:
  postgres:
    image: postgres:16-alpine
    container_name: saferoute-postgres
    environment:
      POSTGRES_DB: saferoute
      POSTGRES_USER: saferoute_user
      POSTGRES_PASSWORD: saferoute_pass
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U saferoute_user -d saferoute"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  postgres_data:

