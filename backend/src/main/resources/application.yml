server:
  port: 8080

saferoute:
  intelligence-url: ${INTELLIGENCE_URL:http://localhost:8000}
  intelligence-key: ${INTERNAL_SERVICE_KEY:dev-internal-secret-key-saferoute-2026}
  weather-url: ${WEATHER_API_URL:https://api.open-meteo.com/v1/forecast}
  frontend-origin: ${FRONTEND_ORIGIN:http://localhost:5173}
  connect-timeout-ms: 3000
  read-timeout-ms: 8000
  openrouteservice:
    url: ${ORS_URL:https://api.openrouteservice.org}
    api-key: ${ORS_API_KEY:}
  osrm:
    url: ${OSRM_URL:https://routing.openstreetmap.de/routed-foot}
  photon:
    url: ${PHOTON_URL:https://photon.komoot.io/api}
  nominatim:
    url: ${NOMINATIM_URL:https://nominatim.openstreetmap.org}

spring:
  application:
    name: saferoute-backend
  profiles:
    active: ${SPRING_PROFILES_ACTIVE:local}
  jpa:
    open-in-view: false

---
spring:
  config:
    activate:
      on-profile: local
  datasource:
    url: jdbc:h2:mem:saferoute;MODE=PostgreSQL;DATABASE_TO_LOWER=TRUE;DEFAULT_NULL_ORDERING=HIGH
    driver-class-name: org.h2.Driver
    username: sa
    password: ""
  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.H2Dialect
  flyway:
    enabled: true
    locations: classpath:db/migration

---
spring:
  config:
    activate:
      on-profile: postgres
  datasource:
    url: jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:saferoute}
    driver-class-name: org.postgresql.Driver
    username: ${DB_USERNAME:saferoute_user}
    password: ${DB_PASSWORD:saferoute_pass}
  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
  flyway:
    enabled: true
    locations: classpath:db/migration
